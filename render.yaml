services:
  - type: web
    name: ecoresearch-backend
    env: python
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ecoresearch-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://ecoresearch-ui.vercel.app,http://localhost:3000

databases:
  - name: ecoresearch-db
    databaseName: ecoresearch_db
    user: ecoresearch_user
